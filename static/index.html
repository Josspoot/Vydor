<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vydor · Coach de running</title>
<script>
  /* Va aquí, antes de pintar nada, y no en app.js: aplicar el tema al final
     de la página haría que quien eligió el oscuro viera un fogonazo blanco
     en cada carga. Es lo único que este archivo ejecuta en línea. */
  if (localStorage.getItem("vydor-tema") === "oscuro")
    document.documentElement.dataset.theme = "dark";
</script>
<style>
  /* Dos temas sobre los mismos tokens. El claro es el de casa; el oscuro se
     activa poniendo data-theme="dark" en <html>, y la elección se guarda.
     Ninguna regla de más abajo puede llevar un color literal: si lo lleva,
     ese punto se queda con el tema equivocado al cambiar. */
  :root {
    --fondo: #f1f4f8;
    --panel: #ffffff;
    --panel-alto: #f6f8fa;
    --borde: #e4e8ee;
    --texto: #111726;
    --tenue: #55607a;
    --apagado: #6b7686;

    /* La acción principal es negra sobre claro y blanca sobre oscuro: se
       invierte con el tema en vez de arrastrar un color de marca. */
    --primario: #0d1220;
    --sobre-primario: #ffffff;
    --acento: #2563eb;
    --sobre-acento: #ffffff;
    --alerta: #dc2626;
    --sobre-alerta: #ffffff;

    --borde-ok: #8fd3ae;
    --borde-aviso: #e6c06a;
    --borde-peligro: #f0a3a3;
    --borde-clave: #b9cdea;

    /* Serie de la gráfica, medida contra #ffffff: 5.17, 5.02 y 5.48 : 1.
       Pasan de sobra el 3:1 de objeto gráfico, y también el 4.5:1 de texto,
       porque el calendario las usa como color de letra. */
    --fase-normal: #2563eb;
    --fase-recuperacion: #b45309;
    --fase-afinamiento: #047857;

    --rejilla: #e9edf3;
    --sombra: 0 1px 2px rgba(16, 24, 40, .04), 0 10px 28px rgba(16, 24, 40, .06);
    --sombra-flotante: 0 10px 30px rgba(16, 24, 40, .14);
    --radio: 18px;
    --radio-chico: 11px;
    --lateral: 278px;
    /* Una sola curva para todo lo que reacciona al puntero: si cada control
       tiene la suya, la interfaz se siente descoordinada. */
    --transicion: background .15s ease, color .15s ease, border-color .15s ease,
                  box-shadow .15s ease, transform .12s ease, opacity .15s ease;
  }

  :root[data-theme="dark"] {
    --fondo: #0f1115;
    --panel: #171a21;
    --panel-alto: #1e2230;
    --borde: #262b36;
    --texto: #e7e9ee;
    --tenue: #99a1b3;
    --apagado: #8b93a5;

    --primario: #f2f4f8;
    --sobre-primario: #0d1220;
    --acento: #60a5fa;
    --sobre-acento: #0b1220;
    --alerta: #f87171;
    --sobre-alerta: #2b0707;

    --borde-ok: #1c5c33;
    --borde-aviso: #6b5312;
    --borde-peligro: #6b2020;
    --borde-clave: #2f4a6d;

    /* Serie validada contra #171a21: 4.78, 5.67 y 5.11 : 1. */
    --fase-normal: #3987e5;
    --fase-recuperacion: #c98500;
    --fase-afinamiento: #199e70;

    --rejilla: #2c2c2a;
    --sombra: 0 1px 2px rgba(0, 0, 0, .3);
    --sombra-flotante: 0 10px 30px rgba(0, 0, 0, .5);
  }
  * { box-sizing: border-box; }
  /* El navegador oculta [hidden] con display:none, pero esa regla suya la pisa
     cualquier display de aquí: darle flex a una vista la dejaba visible en las
     otras pestañas. Se blinda una vez y deja de ser una trampa. */
  [hidden] { display: none !important; }
  /* Un solo foco para todo, y solo con teclado: sin esto los botones sin
     borde propio no dicen dónde está el cursor al tabular. */
  :focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--fondo); color: var(--texto);
    display: flex; flex-direction: column; min-height: 100vh; line-height: 1.5;
  }
  h1, h2, h3 { margin: 0; }
  /* Sin esto los enlaces se quedan con el azul por defecto del navegador, que
     es un color ajeno a los temas: sobre el fondo oscuro resulta ilegible. */
  a { color: var(--acento); }
  .apagado { color: var(--apagado); font-weight: 400; }

  /* ------------------------------------------------------------ cabecera */
  header {
    padding: 11px 18px; border-bottom: 1px solid var(--borde);
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    background: var(--panel); position: sticky; top: 0; z-index: 20;
  }
  .marca {
    font-size: 15px; font-weight: 650; letter-spacing: -0.01em;
    display: flex; align-items: center;
  }
  .marca span.apagado { color: var(--tenue); font-weight: 400; margin-left: 5px; }
  .pestanas {
    display: flex; gap: 3px; background: var(--fondo); padding: 4px;
    border-radius: 999px; border: 1px solid var(--borde);
  }
  .pestana {
    background: none; border: 0; color: var(--tenue); font-family: inherit;
    font-size: 13px; font-weight: 600; padding: 7px 16px; border-radius: 999px;
    cursor: pointer;
  }
  .pestana { transition: var(--transicion); }
  .pestana:hover { color: var(--texto); }
  .pestana:active { transform: scale(.96); }
  .pestana[aria-selected="true"] {
    background: var(--panel); color: var(--texto); box-shadow: var(--sombra);
  }
  .estado {
    font-size: 12.5px; color: var(--tenue); margin-left: auto;
    display: flex; align-items: center; gap: 7px;
  }
  .punto { width: 8px; height: 8px; border-radius: 50%; background: var(--apagado); flex: none; }
  .punto.activo { background: var(--acento); box-shadow: 0 0 8px var(--acento); }
  .punto.error { background: var(--alerta); }
  button { font-family: inherit; }
  .marcaIcono {
    display: inline-flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; border-radius: 9px; margin-right: 9px;
    background: var(--primario); color: var(--sobre-primario);
  }
  .marcaIcono .ico { width: 17px; height: 17px; vertical-align: 0; }

  /* -------------------------------------------------------------- diseño */
  /* Una sola columna: el historial ya no ocupa sitio permanente, se despliega
     por encima cuando hace falta. Se consulta de vez en cuando; tenerlo
     siempre delante robaba ancho a lo que sí se mira. */
  main {
    flex: 1; display: block; padding: 18px 16px 28px;
    width: 100%; max-width: 1120px; margin: 0 auto;
  }

  /* --------------------------------------------------------------- iconos */
  .ico {
    width: 1.15em; height: 1.15em; fill: none; stroke: currentColor;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
    vertical-align: -0.2em; flex: none;
  }
  .iconoBoton {
    display: inline-flex; align-items: center; justify-content: center;
    background: none; border: 1px solid transparent; color: var(--tenue);
    border-radius: var(--radio-chico); width: 34px; height: 34px;
    font-size: 15px; cursor: pointer; transition: var(--transicion);
  }
  .iconoBoton:hover { background: var(--panel-alto); color: var(--texto); }
  .iconoBoton:active { transform: scale(.94); }
  .iconoBoton.grande { width: 40px; height: 40px; font-size: 17px; }
  .iconoBoton.primario {
    background: var(--primario); color: var(--sobre-primario); border-color: transparent;
  }
  .iconoBoton.primario:hover { background: var(--primario); filter: brightness(1.25); }
  .iconoBoton:disabled { opacity: .4; cursor: not-allowed; transform: none; }
  .iconoBoton.hablando { background: var(--alerta); color: var(--sobre-alerta); }
  .panel {
    background: var(--panel); border: 1px solid var(--borde);
    border-radius: var(--radio); padding: 22px; min-width: 0;
    box-shadow: var(--sombra);
  }
  .panel > h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .09em;
    color: var(--apagado); margin-bottom: 14px; font-weight: 600;
  }

  /* ----------------------------------------------------------- historial */
  /* Cajón: fuera de pantalla hasta que se pide, y por encima de todo cuando
     está. El velo de detrás sirve para cerrarlo con un clic en cualquier
     sitio, que es como se espera que se cierre algo así. */
  #historial {
    position: fixed; top: 0; left: 0; bottom: 0; width: var(--lateral); z-index: 25;
    background: var(--panel); border-right: 1px solid var(--borde);
    padding: 14px; overflow-y: auto; overscroll-behavior: contain;
    transform: translateX(-100%); transition: transform .22s cubic-bezier(.4, 0, .2, 1);
  }
  body.historialAbierto #historial { transform: none; box-shadow: var(--sombra-flotante); }
  #velo {
    position: fixed; inset: 0; z-index: 24; background: rgb(0 0 0 / .35);
    opacity: 0; transition: opacity .22s ease;
  }
  body.historialAbierto #velo { opacity: 1; }
  #historial h3 {
    font-size: 10px; text-transform: uppercase; letter-spacing: .09em;
    color: var(--apagado); margin: 16px 0 7px; font-weight: 600;
  }
  .nueva {
    width: 100%; background: var(--panel-alto); color: var(--texto);
    border: 1px solid var(--borde); border-radius: var(--radio-chico); padding: 10px;
    font-size: 13px; font-weight: 600; cursor: pointer; transition: var(--transicion);
    display: flex; align-items: center; justify-content: center; gap: 7px;
  }
  .nueva:hover {
    border-color: var(--acento); color: var(--acento); transform: translateY(-1px);
    box-shadow: var(--sombra);
  }
  .nueva:active { transform: translateY(0); }
  .item {
    display: block; width: 100%; text-align: left; background: none; border: 0;
    border-radius: 8px; padding: 8px 9px; margin-bottom: 2px; cursor: pointer; color: var(--texto);
  }
  .item { transition: var(--transicion); }
  .item:hover { background: var(--panel-alto); }
  .item:active { transform: scale(.985); }
  .item.activo { background: var(--panel-alto); box-shadow: inset 2px 0 0 var(--acento); }
  .item .titulo {
    display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .item .meta { display: block; font-size: 11px; color: var(--apagado); margin-top: 1px; }
  /* Marca cuál de los planes manda los recordatorios diarios. */
  .insignia {
    font-size: 10px; text-transform: uppercase; letter-spacing: .04em;
    background: var(--acento); color: var(--sobre-acento); border-radius: 999px;
    padding: 1px 6px; margin-left: 4px; vertical-align: 1px;
  }
  .accion:disabled { opacity: .55; cursor: default; }
  .pequeno { font-size: 12.5px; padding: 4px 9px; }

  /* -------------------------------------------------------- conversación */
  /* Con la charla empezada el panel es una columna normal: turnos arriba,
     compositor abajo. Vacío, todo se centra en la pantalla y el saludo es lo
     primero que se ve; es la diferencia entre "empieza tú" y un formulario. */
  #vista-chat { display: flex; flex-direction: column; min-height: 62vh; }
  #vista-chat.vacio { justify-content: center; }
  #conversacion { max-height: 62vh; overflow-y: auto; overscroll-behavior: contain; }
  #vista-chat.vacio #conversacion { max-height: none; overflow: visible; }

  .bienvenida { text-align: center; padding: 8px 0 4px; }
  .bienvenida .saludo {
    font-size: 27px; font-weight: 660; letter-spacing: -0.025em; margin: 0 0 6px;
  }
  .bienvenida .frase { color: var(--tenue); font-size: 14.5px; margin: 0 auto 22px; max-width: 46ch; }
  .bienvenida .emblema {
    width: 46px; height: 46px; border-radius: 15px; margin: 0 auto 16px;
    display: flex; align-items: center; justify-content: center;
    background: var(--primario); color: var(--sobre-primario);
  }
  .bienvenida .emblema .ico { width: 25px; height: 25px; vertical-align: 0; }
  .bienvenida .ejemplos {
    display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; margin: 0;
  }
  .bienvenida .ejemplos li { margin: 0; }
  .turno { margin-bottom: 14px; font-size: 14px; }
  .turno .quien {
    font-size: 10px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--apagado); display: block; margin-bottom: 3px; font-weight: 600;
  }
  .turno.coach .quien { color: var(--acento); }
  .turno.sistema { color: var(--tenue); font-style: italic; font-size: 13px; }
  .vacio { color: var(--tenue); font-size: 14px; margin: 0; }
  .vacio strong { color: var(--texto); font-weight: 600; }
  /* Los ejemplos son botones de verdad: se pulsan y arrancan la charla. Antes
     eran texto y había que copiarlos a mano, que es pedirle trabajo a quien
     todavía no sabe qué decir. */
  .ejemplos { margin: 14px 0 0; padding: 0; list-style: none; }
  .ejemplos li { margin-bottom: 7px; }
  .ejemplos button {
    font-family: inherit; font-size: 13px; color: var(--tenue); cursor: pointer;
    padding: 9px 14px; background: var(--panel-alto); border-radius: 999px;
    border: 1px solid var(--borde); transition: var(--transicion); text-align: left;
  }
  .ejemplos button:hover {
    color: var(--texto); border-color: var(--acento); transform: translateY(-1px);
    box-shadow: var(--sombra);
  }
  .ejemplos button:active { transform: translateY(0); }

  /* Compositor: la caja entera parece el campo, y dentro viven la voz y el
     envío. Hablar y escribir son la misma acción con distinta entrada, así
     que conviene que estén en el mismo sitio. */
  .escribir {
    display: flex; gap: 8px; align-items: center; margin-top: 16px;
    background: var(--panel-alto); border: 1px solid var(--borde);
    border-radius: 999px; padding: 5px 6px 5px 8px; transition: var(--transicion);
  }
  .escribir:focus-within { border-color: var(--acento); box-shadow: var(--sombra); }
  .escribir input {
    flex: 1; min-width: 0; background: none; color: var(--texto); border: 0;
    padding: 11px 10px; font-size: 14.5px; font-family: inherit;
  }
  .escribir input:focus { outline: none; }
  .escribir input::placeholder { color: var(--apagado); }
  /* La voz es la acción principal de un coach de voz: escribir existe para
     quien no quiere hablar, no al revés. El orden y el peso lo dicen. */
  #boton { margin-left: 2px; }

  /* -------------------------------------------------------- resumen plan */
  .hero {
    display: flex; flex-wrap: wrap; gap: 18px 28px; align-items: flex-end;
    padding-bottom: 16px; margin-bottom: 16px; border-bottom: 1px solid var(--borde);
  }
  .cifra { display: flex; flex-direction: column; gap: 2px; }
  .cifra .valor { font-size: 30px; font-weight: 680; letter-spacing: -0.02em; }
  .cifra .rotulo {
    font-size: 11px; color: var(--apagado); text-transform: uppercase;
    letter-spacing: .07em; font-weight: 600;
  }
  .veredicto {
    display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px;
    padding: 12px 14px; border-radius: 10px; margin-bottom: 22px;
    background: var(--panel-alto); border: 1px solid var(--borde);
  }
  .veredicto .icono { font-size: 15px; line-height: 1.35; flex: none; }
  .veredicto.viable { border-color: var(--borde-ok); }
  .veredicto.ajustado, .veredicto.demasiado_largo { border-color: var(--borde-aviso); }
  .veredicto.no_recomendado { border-color: var(--borde-peligro); }
  .veredicto b { display: block; margin-bottom: 2px; }

  .bloque { margin-bottom: 24px; }
  .bloque > h3 { font-size: 13px; margin-bottom: 4px; font-weight: 650; }
  .bloque > .pie, .pie { font-size: 12.5px; color: var(--tenue); margin: 0 0 12px; }
  .ritmos { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
  .ritmo { background: var(--panel-alto); border: 1px solid var(--borde); border-radius: 10px; padding: 11px 13px; }
  .ritmo .cab { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .ritmo .zona { font-size: 13px; font-weight: 650; }
  .ritmo .valor { font-size: 14px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .ritmo .desc { font-size: 12px; color: var(--tenue); margin-top: 4px; }

  /* ------------------------------------------------------------- gráfica */
  .grafica { position: relative; padding-left: 34px; }
  .ejeY {
    position: absolute; left: 0; top: 0; bottom: 22px; width: 32px;
    font-size: 10px; color: var(--apagado); font-variant-numeric: tabular-nums;
  }
  .ejeY span { position: absolute; right: 0; transform: translateY(-50%); }
  .lienzo {
    position: relative; height: 132px; display: flex; align-items: flex-end;
    gap: 2px; border-bottom: 1px solid var(--rejilla);
  }
  .rejilla { position: absolute; inset: 0; pointer-events: none; }
  .rejilla i { position: absolute; left: 0; right: 0; border-top: 1px solid var(--rejilla); }
  .barra {
    flex: 1 1 0; min-width: 0; position: relative; cursor: pointer;
    border-radius: 4px 4px 0 0; background: var(--fase-normal); transition: filter .12s;
  }
  .barra.recuperacion { background: var(--fase-recuperacion); }
  .barra.afinamiento { background: var(--fase-afinamiento); }
  .barra:hover { filter: brightness(1.25); }
  .barra.sel { outline: 2px solid var(--texto); outline-offset: 1px; }
  .ejeX {
    display: flex; gap: 2px; margin-top: 6px; font-size: 10px;
    color: var(--apagado); font-variant-numeric: tabular-nums;
  }
  .ejeX span { flex: 1 1 0; text-align: center; min-width: 0; overflow: hidden; }
  .leyenda {
    display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 12px;
    font-size: 12px; color: var(--tenue);
  }
  .leyenda i {
    display: inline-block; width: 9px; height: 9px; border-radius: 2px;
    margin-right: 6px; vertical-align: middle;
  }
  #globo {
    position: fixed; z-index: 30; pointer-events: none; opacity: 0;
    background: var(--panel-alto); border: 1px solid var(--borde);
    border-radius: 9px; padding: 8px 11px; font-size: 12.5px;
    box-shadow: var(--sombra-flotante); transition: opacity .1s; max-width: 220px;
  }
  #globo b { display: block; margin-bottom: 2px; }
  #globo .m { color: var(--tenue); }

  /* --------------------------------------------------- semana a semana */
  .fichas { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 14px; }
  .ficha {
    background: var(--panel-alto); border: 1px solid var(--borde); color: var(--tenue);
    border-radius: 8px; padding: 5px 10px; font-size: 12.5px; cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  .ficha { transition: var(--transicion); }
  .ficha:hover { color: var(--texto); border-color: var(--acento); }
  .ficha:active { transform: scale(.94); }
  .ficha[aria-pressed="true"] {
    background: var(--texto); border-color: var(--texto); color: var(--fondo); font-weight: 650;
  }
  .dias { display: grid; gap: 6px; }
  .dia {
    display: grid; grid-template-columns: 82px 1fr auto; gap: 12px; align-items: baseline;
    padding: 11px 13px; border-radius: 10px; background: var(--panel-alto);
    border: 1px solid var(--borde); font-size: 13.5px;
  }
  @media (max-width: 560px) {
    .dia { grid-template-columns: 1fr auto; }
    .dia .nombre { grid-column: 1 / -1; }
  }
  .dia.descanso { opacity: .55; }
  .dia.clave { border-color: var(--borde-clave); }
  .dia.carrera { border-color: var(--acento); }
  .dia .nombre {
    font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--apagado); font-weight: 600;
  }
  .dia .que { font-weight: 600; }
  .dia .detalle { font-weight: 400; color: var(--tenue); display: block; font-size: 12.5px; margin-top: 2px; }
  .dia .km { font-variant-numeric: tabular-nums; color: var(--tenue); font-size: 12.5px; white-space: nowrap; }
  .resumenSemana {
    display: flex; gap: 18px; flex-wrap: wrap; font-size: 12.5px;
    color: var(--tenue); margin-bottom: 12px;
  }
  .resumenSemana b { color: var(--texto); font-variant-numeric: tabular-nums; }

  /* ---------------------------------------------------------- calendario */
  .cabMes { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .tituloMes { font-size: 16px; font-weight: 650; text-transform: capitalize; }
  .flecha {
    background: var(--panel-alto); border: 1px solid var(--borde); color: var(--texto);
    border-radius: 8px; width: 30px; height: 30px; font-size: 16px; cursor: pointer; line-height: 1;
  }
  .flecha { transition: var(--transicion); display: inline-flex;
            align-items: center; justify-content: center; }
  .flecha:hover:not(:disabled) { border-color: var(--acento); color: var(--acento); }
  .flecha:active:not(:disabled) { transform: scale(.92); }
  .flecha:disabled { opacity: .3; cursor: not-allowed; }
  .rejillaMes {
    display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-top: 10px;
  }
  .cabDia {
    text-align: center; font-size: 10px; color: var(--apagado);
    text-transform: uppercase; letter-spacing: .06em; font-weight: 600; padding-bottom: 2px;
  }
  .celda {
    min-height: 62px; border-radius: 8px; padding: 5px 6px; font-size: 11px;
    background: var(--panel-alto); border: 1px solid var(--borde);
    display: flex; flex-direction: column; gap: 1px;
  }
  .celda.vacia { background: transparent; border-color: transparent; }
  .celda.fuera { opacity: .35; }
  .celda[data-semana] { cursor: pointer; }
  .celda[data-semana] { transition: var(--transicion); }
  .celda[data-semana]:hover { border-color: var(--acento); box-shadow: var(--sombra); }
  .celda.hoy { outline: 2px solid var(--acento); outline-offset: -1px; }
  .celda .num { font-variant-numeric: tabular-nums; color: var(--apagado); font-weight: 600; }
  .celda .et { font-weight: 650; font-size: 11px; }
  .celda .k { color: var(--tenue); font-variant-numeric: tabular-nums; }
  .celda.normal .et { color: var(--fase-normal); }
  .celda.recuperacion .et { color: var(--fase-recuperacion); }
  .celda.afinamiento .et { color: var(--fase-afinamiento); }

  /* ------------------------------------------------------------ acciones */
  .acciones { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .accion {
    background: var(--panel-alto); color: var(--texto); border: 1px solid var(--borde);
    border-radius: var(--radio-chico); padding: 9px 14px; font-size: 13px;
    font-weight: 600; cursor: pointer; text-decoration: none;
    display: inline-flex; align-items: center; gap: 7px; transition: var(--transicion);
  }
  .accion:hover:not(:disabled) {
    border-color: var(--acento); color: var(--acento); transform: translateY(-1px);
    box-shadow: var(--sombra);
  }
  .accion:active:not(:disabled) { transform: translateY(0); }
  .pieTelegram { font-size: 11.5px; color: var(--apagado); margin: 6px 0 0; line-height: 1.45; }
  /* El enlace de Telegram se ve como botón, pero es un <a>: tiene que abrir
     una pestaña nueva hacia t.me, no ejecutar JavaScript. */
  .enlaceBoton {
    display: block; text-align: center; text-decoration: none;
    background: var(--panel-alto); color: var(--texto);
    border: 1px solid var(--borde); border-radius: 8px;
    padding: 8px 9px; font-size: 12.5px;
  }
  .enlaceBoton:hover {
    border-color: var(--acento); color: var(--acento); transform: translateY(-1px);
    box-shadow: var(--sombra);
  }
  .enlaceBoton:active { transform: translateY(0); }
  .vinculado { color: var(--acento); font-size: 12px; }
  .aviso {
    font-size: 12px; color: var(--apagado); margin-top: 20px;
    padding-top: 14px; border-top: 1px solid var(--borde);
  }

  /* ---------------------------------------------------------- responsive */
  @media (max-width: 980px) {
    .marca span.apagado { display: none; }
    #conversacion { max-height: 46vh; }
  }
  @media (max-width: 560px) {
    :root { --lateral: 84vw; }
    header { padding: 9px 12px; gap: 8px; }
    main { padding: 12px 10px 20px; }
  }
  @media (max-width: 620px) {
    .celda { min-height: 50px; font-size: 10px; }
    .cifra .valor { font-size: 25px; }
  }

  /* ----------------------------------------------------------- impresión */
  /* En pantalla se ve una semana cada vez; un PDF con solo esa no serviría,
     así que se imprime una vista aparte con el plan entero desplegado. */
  #paraImprimir { display: none; }
  @media print {
    body > header, main, #globo { display: none !important; }
    #paraImprimir {
      display: block; color: #000; background: #fff; font-size: 10.5pt; padding: 0; margin: 0;
    }
    #paraImprimir h1 { font-size: 18pt; margin: 0 0 2mm; }
    #paraImprimir h2 { font-size: 12pt; margin: 0 0 1mm; }
    .metaImpresa { color: #444; margin: 0 0 4mm; font-size: 9.5pt; }
    .veredictoImpreso {
      border: 1pt solid #999; padding: 3mm; border-radius: 2mm; margin: 0 0 6mm; font-size: 10pt;
    }
    /* Sin esto cada semana se lleva una página entera y el PDF sale con la
       mitad en blanco. Lo que no debe partirse es la fila de un día ni el
       título separado de su tabla; las semanas pueden fluir. */
    .semanaImpresa { margin-bottom: 7mm; }
    .semanaImpresa h2, .semanaImpresa .metaImpresa {
      break-after: avoid; page-break-after: avoid;
    }
    #paraImprimir tr { break-inside: avoid; page-break-inside: avoid; }
    #paraImprimir table { width: 100%; border-collapse: collapse; }
    #paraImprimir td { border-bottom: 0.4pt solid #ccc; padding: 1.6mm 2mm; vertical-align: top; }
    #paraImprimir td.d { width: 24mm; color: #444; font-size: 9pt; }
    #paraImprimir td.km { width: 20mm; text-align: right; white-space: nowrap; }
    #paraImprimir td.t span { color: #444; font-size: 9.5pt; }
    .descansoImpreso { color: #888; }
    .ritmosImpresos { margin-bottom: 6mm; }
    .avisoImpreso {
      margin-top: 8mm; font-size: 8.5pt; color: #666;
      border-top: 0.4pt solid #ccc; padding-top: 2mm;
    }
    @page { margin: 14mm 12mm; }
  }
</style>
</head>
<body>

<header>
  <button id="abrirHistorial" class="iconoBoton" type="button"
          aria-label="Mostrar u ocultar el historial" aria-expanded="false"></button>
  <div class="marca"><span class="marcaIcono"></span>Vydor <span class="apagado">· entrenador de running</span></div>
  <div class="pestanas" role="tablist">
    <button class="pestana" data-vista="chat" role="tab" aria-selected="true">Chat</button>
    <button class="pestana" data-vista="plan" role="tab" aria-selected="false">Plan</button>
    <button class="pestana" data-vista="calendario" role="tab" aria-selected="false">Calendario</button>
  </div>
  <button id="tema" class="iconoBoton" type="button"
          aria-label="Cambiar entre tema claro y oscuro"></button>
  <div class="estado"><span class="punto" id="punto"></span><span id="estado">desconectado</span></div>
</header>

<div id="velo" hidden></div>

<main>
  <aside id="historial"></aside>

  <div>
    <section class="vista panel" id="vista-chat">
      <div id="conversacion"></div>
      <form id="formTexto" class="escribir">
        <input id="entradaTexto" type="text" autocomplete="off"
               placeholder="Escríbele a Vydor…" />
        <button type="submit" id="enviarTexto" class="iconoBoton grande"
                aria-label="Enviar"></button>
        <button type="button" id="boton" class="iconoBoton grande primario"
                aria-label="Hablar con Vydor"></button>
      </form>
    </section>

    <section class="vista panel" id="vista-plan" hidden>
      <h2>Tu plan</h2>
      <div id="accionesPlan" hidden>
        <div class="acciones">
          <button class="accion" id="pdf">
            <svg class="ico"><use href="#i-descarga"/></svg>Descargar plan en PDF</button>
          <button class="accion" id="activar">
            <svg class="ico"><use href="#i-campana"/></svg>Recibir recordatorios de este plan</button>
        </div>
      </div>
      <div id="plan">
        <p class="vacio">Aquí aparecerá tu plan en cuanto Vydor lo arme: los ritmos a los
          que debes correr y qué hacer cada día de cada semana.</p>
      </div>
      <p class="aviso">
        Orientación de entrenamiento, no consejo médico. Ante dolor persistente,
        consulta a un profesional de la salud.
      </p>
    </section>

    <section class="vista" id="vista-calendario" hidden></section>
  </div>
</main>

<div id="globo" role="status"></div>
<div id="paraImprimir"></div>

<script src="/static/app.js"></script>
</body>
</html>
